name: Docker-Beta
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/container-beta.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: books-and-audio-beta
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/christophzepp/books-and-audio

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test the Dockge stack
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          export BOOKS_AUDIO_IMAGE="$IMAGE:build-$GITHUB_SHA-$ARCH"
          docker build --pull --tag "$BOOKS_AUDIO_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" .
          docker run --rm --network none -v "$PWD:/src:ro" -w /src "$BOOKS_AUDIO_IMAGE" python -m unittest discover
          sh smoke-compose.sh
      - name: Upload tested architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:build-$GITHUB_SHA-$ARCH"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish image and attach Compose to the prerelease
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            [[ "$tagged_sha" == "$GITHUB_SHA" ]] || { echo "Version already belongs to another commit"; exit 1; }
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$version" "$IMAGE:build-$GITHUB_SHA-amd64" "$IMAGE:build-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$version" | jq -e '([.manifests[].platform | select(.os=="linux") | .architecture] | sort) == ["amd64","arm64"]'
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create -t "$IMAGE:beta" -t "$IMAGE:tracking-beta" "$IMAGE:$version"
          fi
          cp compose.dockge.yaml "$RUNNER_TEMP/compose.yaml"
          cp compose.tracking.yaml "$RUNNER_TEMP/compose.tracking.yaml"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/compose.tracking.yaml" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/compose.tracking.yaml" --target "$GITHUB_SHA" --prerelease \
              --title "Books & Audio $version" \
              --notes "Fertiges Docker-Image für Linux auf AMD64 und ARM64: \`$IMAGE:$version\`. Für laufende Updates des Hauptdienstes \`beta\`, für den optionalen PinePods-Floppy-Trackingdienst \`tracking-beta\` verwenden. Die angehängte compose.yaml installiert den Hauptdienst, compose.tracking.yaml den separaten Trackingdienst. [Einrichtung und Updates](https://github.com/$GITHUB_REPOSITORY/blob/$tag/DOCKGE.md) · [Tracking einrichten](https://github.com/$GITHUB_REPOSITORY/blob/$tag/TRACKING.md)."
          fi

# Optionaler, privater PinePods -> Floppy-Import. Kein veröffentlichter Host-Port.
# Das externe Netzwerk muss dem Netzwerk der vorhandenen Floppy-Installation entsprechen.
services:
  tracking:
    image: ${BOOKS_AUDIO_TRACKING_IMAGE:-ghcr.io/christophzepp/books-and-audio:tracking-beta}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, gpodder_relay.py]
    volumes:
      - ./tracking/config.json:/tracking/config.json:ro
      - ./tracking/state:/tracking/state
      # Für native_source in config.json erforderlich; vorher die private Datei
      # mit Modus 0600 für UID 1000 anlegen und diesen Bind-Mount aktivieren.
      # Ohne native_source bleibt der bisherige GPodder-Aktionsmodus verfügbar.
      # - type: bind
      #   source: ./tracking/pinepods-api.key
      #   target: /tracking/pinepods-api.key
      #   read_only: true
      #   bind:
      #     create_host_path: false
    networks:
      floppy:
        aliases: [books-audio-tracking]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  floppy:
    external: true
    name: ${FLOPPY_NETWORK:-floppy-network}

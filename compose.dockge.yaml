# In Dockge als compose.yaml einfügen. In der Stack-Umgebung BOOKS_AUDIO_HOST
# auf die IP oder den Namen setzen, mit dem der Browser den Server erreicht.
x-service: &service
  image: ${BOOKS_AUDIO_IMAGE:-ghcr.io/christophzepp/books-and-audio:beta}
  user: "1000:1000"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:mode=1777]

services:
  init:
    <<: *service
    network_mode: none
    restart: "no"
    command: [python, dockge_init.py]
    volumes:
      - config:/installation
      - web_key:/keys
      - state:/state
      - control:/state/control

  web:
    <<: *service
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      ADMIN_ALLOWED_HOSTS: "localhost,127.0.0.1,${BOOKS_AUDIO_HOST:-localhost}"
      ADMIN_KEY_FILE: /keys/secret.key
    ports:
      - "${BOOKS_AUDIO_BIND:-0.0.0.0}:${BOOKS_AUDIO_PORT:-8790}:8790"
    volumes:
      - web_key:/keys:ro
      - web:/admin-state
      - control:/admin-state/control
      # Optional bei installiertem Tracking-Stack. Den tatsächlichen NVMe-Pfad verwenden.
      # - /opt/stacks/books-audio-tracking/tracking/state:/tracking-readonly:ro
      # Für Adressfreigaben in beiden Stacks dieselben beiden Hostpfade eintragen.
      # - /opt/stacks/books-audio-tracking/tracking/proof:/tracking-proof:ro
      # - /opt/stacks/books-audio-tracking/tracking/address-approvals:/tracking-alias:rw
    healthcheck:
      test: [CMD, python, admin_web.py, --health]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *service
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      BOOK_PROGRESS_ADMIN_CONTROL: "1"
    command: [python, sync.py, --config, /installation/current/config.json, --credentials, /installation/current/credentials.enc, --key, /installation/current/secret.key, --apply, --loop]
    volumes:
      - config:/installation:ro
      - state:/state
      - control:/state/control
    healthcheck:
      test: [CMD, python, sync.py, --health]
      interval: 20s
      timeout: 5s
      retries: 5

  restore-check:
    <<: *service
    profiles: [restore]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    network_mode: none
    command: [python, restore_scheduler.py, --loop]
    tmpfs: ["/tmp:rw,nosuid,nodev,mode=1777,size=1g"]
    environment:
      RESTORE_PRIMARY_ORIGIN: "${RESTORE_PRIMARY_ORIGIN:-}"
      RESTORE_RELAY_ORIGIN: "${RESTORE_RELAY_ORIGIN:-}"
    volumes:
      - type: bind
        source: ${RESTORE_BACKUP_CATALOG:-./restore-backups}
        target: /backups
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: control
        target: /result
        volume: {subpath: restore-check, nocopy: true}

  series-organizer:
    <<: *service
    profiles: [hoerspiele]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command: [python, series_organizer.py, --loop]
    environment:
      LISTENARR_ORIGIN: "${SERIES_LISTENARR_URL:-}"
      LISTENARR_KEY_FILE: "${SERIES_LISTENARR_KEY_FILE-/series-config/listenarr.key}"
      LISTENARR_CONFIG_FILE: "${SERIES_LISTENARR_CONFIG_FILE:-}"
      SERIES_SPECIAL_ASINS: "${SERIES_SPECIAL_ASINS:-}"
      SERIES_MAINTENANCE_LOCK_DIR: "${SERIES_MAINTENANCE_LOCK_DIR:-}"
      SERIES_IMPORT_KEY_FILE: "${SERIES_IMPORT_KEY_FILE:-}"
      SERIES_READARR_ORIGIN: "${SERIES_READARR_ORIGIN:-}"
      SERIES_READARR_KEY_FILE: "${SERIES_READARR_KEY_FILE:-}"
      SERIES_BOOKSHELF_ORIGIN: "${SERIES_BOOKSHELF_ORIGIN:-}"
      SERIES_BOOKSHELF_KEY_FILE: "${SERIES_BOOKSHELF_KEY_FILE:-}"
      SERIES_CHAPTARR_ORIGIN: "${SERIES_CHAPTARR_ORIGIN:-}"
      SERIES_CHAPTARR_KEY_FILE: "${SERIES_CHAPTARR_KEY_FILE:-}"
      SERIES_RMAB_ORIGIN: "${SERIES_RMAB_ORIGIN:-}"
      SERIES_RMAB_KEY_FILE: "${SERIES_RMAB_KEY_FILE:-}"
      SERIES_ABS_ORIGIN: "${SERIES_ABS_ORIGIN:-}"
      SERIES_ABS_KEY_FILE: "${SERIES_ABS_KEY_FILE:-}"
      SERIES_ABS_LIBRARY_ID: "${SERIES_ABS_LIBRARY_ID:-}"
      SERIES_ABS_RMAB_ROOT: "${SERIES_ABS_RMAB_ROOT:-}"
    volumes:
      - type: volume
        source: state
        target: /series-control
        read_only: true
        volume: {subpath: series-control, nocopy: true}
      - type: volume
        source: state
        target: /series-state
        volume: {subpath: series-status, nocopy: true}
      - type: bind
        source: ${SERIES_CONFIG_DIR:-./series-config}
        target: /series-config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SERIES_MEDIA_DIR:-./hoerspiele}
        target: /audio-dramas
        bind: {create_host_path: false}

volumes:
  config:
  web_key:
  web:
  state:
  control:
